apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timesheet-frontend
  template:
    metadata:
      labels:
        app: timesheet-frontend
    spec:
      containers:
        - name: frontend
          image: timesheet-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: timesheet-frontend
  annotations:
    cloud.google.com/backend-config: '{"default": "timesheet-iap"}'
spec:
  type: ClusterIP
  selector:
    app: timesheet-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
