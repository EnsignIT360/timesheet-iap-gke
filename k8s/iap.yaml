apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: timesheet-iap
spec:
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: timesheet-iap-oauth
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 8080
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: timesheet-iap-cert
spec:
  domains:
    - it360-45.ensign.quest
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: timesheet-iap-frontend
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timesheet-iap
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: timesheet-iap-ip
    networking.gke.io/managed-certificates: timesheet-iap-cert
    networking.gke.io/v1beta1.FrontendConfig: timesheet-iap-frontend
spec:
  rules:
    - host: it360-45.ensign.quest
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: timesheet-frontend
                port:
                  number: 80
