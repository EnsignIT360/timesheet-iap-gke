apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: timesheet
resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - iap.yaml
images:
  - name: timesheet-backend
    newName: docker.io/dewfaced/timesheet-backend
    newTag: latest
  - name: timesheet-frontend
    newName: docker.io/dewfaced/timesheet-frontend
    newTag: latest
